plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jks.store'
    compileSdk 34

    defaultConfig {
        applicationId "com.jks.store"
        minSdk 22            // Android 5.1.1 trở lên
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Thu nhỏ mã và tài nguyên cho nhẹ; vẫn ký bằng khóa debug để cài trực tiếp
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
